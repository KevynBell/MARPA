<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MARPA</title>

    <style>
        :root {
            color-scheme: dark;

            --background: #0b0d10;
            --surface: #12161b;
            --surface-raised: #181d23;
            --surface-hover: #1d232b;

            --border: #303842;
            --border-light: #3c4652;

            --text: #f3f6f8;
            --text-muted: #9aa5b1;

            --user: #4d8cff;
            --user-soft: rgba(77, 140, 255, 0.12);

            --marpa: #48c866;
            --marpa-soft: rgba(72, 200, 102, 0.10);

            --danger: #ff6b6b;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(53, 80, 112, 0.15),
                    transparent 35%
                ),
                var(--background);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        textarea {
            font: inherit;
        }

        .app-shell {
            width: min(1180px, calc(100% - 32px));
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 28px 0 18px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 22px;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: 0.04em;
        }

        .brand p {
            margin: 6px 0 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .status-panel {
            min-width: 205px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(18, 22, 27, 0.84);
            box-shadow: 0 12px 30px var(--shadow);
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--marpa);
            box-shadow: 0 0 12px rgba(72, 200, 102, 0.7);
        }

        .system-detail {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 6px;
            margin-top: 5px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .system-detail strong {
            color: var(--text);
            font-weight: 600;
        }

        .chat-panel {
            flex: 1;
            min-height: 440px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(18, 22, 27, 0.88);
            box-shadow: 0 18px 50px var(--shadow);
            overflow: hidden;
        }

        #chat {
            height: clamp(440px, 58vh, 680px);
            overflow-y: auto;
            padding: 22px;
            scroll-behavior: smooth;
        }

        #chat:empty::before {
            content: "MARPA is online and ready.";
            display: grid;
            place-items: center;
            min-height: 100%;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .message {
            position: relative;
            margin-bottom: 18px;
            padding: 17px 18px 18px 20px;
            border: 1px solid var(--border);
            border-left-width: 4px;
            border-radius: 12px;
            background: var(--surface-raised);
            animation: message-enter 180ms ease-out;
        }

        .message.user {
            border-left-color: var(--user);
            background:
                linear-gradient(
                    90deg,
                    var(--user-soft),
                    transparent 28%
                ),
                var(--surface-raised);
        }

        .message.marpa {
            border-left-color: var(--marpa);
            background:
                linear-gradient(
                    90deg,
                    var(--marpa-soft),
                    transparent 28%
                ),
                var(--surface-raised);
        }

        .message.error {
            border-left-color: var(--danger);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .message-label {
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .message.user .message-label {
            color: var(--user);
        }

        .message.marpa .message-label {
            color: var(--marpa);
        }

        .message-time {
            color: var(--text-muted);
            font-size: 0.78rem;
            white-space: nowrap;
        }

        .message-text {
            color: var(--text);
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.thinking .message-text {
            color: var(--text-muted);
            font-style: italic;
        }

        .thinking-dots::after {
            content: "";
            animation: thinking-dots 1.4s steps(4, end) infinite;
        }

        .streaming-cursor::after {
            content: "▋";
            display: inline-block;
            margin-left: 3px;
            color: var(--marpa);
            animation: cursor-blink 0.8s step-end infinite;
        }

        .composer {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(18, 22, 27, 0.92);
            box-shadow: 0 14px 36px var(--shadow);
        }

        #prompt {
            width: 100%;
            min-height: 105px;
            max-height: 260px;
            resize: vertical;
            padding: 4px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            line-height: 1.55;
        }

        #prompt::placeholder {
            color: #77828e;
        }

        #prompt:disabled {
            opacity: 0.65;
        }

        .composer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-top: 12px;
        }

        .composer-hint {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        #send-button {
            min-width: 112px;
            padding: 11px 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            background: var(--user);
            color: white;
            font-weight: 750;
            cursor: pointer;
            transition:
                transform 120ms ease,
                filter 120ms ease,
                opacity 120ms ease;
        }

        #send-button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        #send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        #send-button:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        .app-footer {
            padding-top: 17px;
            color: var(--text-muted);
            text-align: center;
            font-size: 0.82rem;
        }

        @keyframes cursor-blink {
            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }

        @keyframes thinking-dots {
            0% {
                content: "";
            }

            25% {
                content: ".";
            }

            50% {
                content: "..";
            }

            75%,
            100% {
                content: "...";
            }
        }

        @keyframes message-enter {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 720px) {
            .app-shell {
                width: min(100% - 20px, 1180px);
                padding-top: 18px;
            }

            .app-header {
                flex-direction: column;
            }

            .status-panel {
                width: 100%;
            }

            #chat {
                height: 56vh;
                padding: 13px;
            }

            .message {
                padding: 14px;
            }

            .composer-footer {
                align-items: stretch;
                flex-direction: column;
            }

            #send-button {
                width: 100%;
            }
        }
        /* MARPA Markdown formatting */

	.message-text p {
	    margin: 0 0 0.9rem;
	}

	.message-text p:last-child {
	    margin-bottom: 0;
	}

	.message-text h1,
	.message-text h2,
	.message-text h3,
	.message-text h4 {
	    margin: 1.2rem 0 0.6rem;
	    line-height: 1.3;
	}

	.message-text h1 {
	    font-size: 1.5rem;
	}

	.message-text h2 {
	    font-size: 1.3rem;
	}

	.message-text h3 {
	    font-size: 1.15rem;
	}

	.message-text ul,
	.message-text ol {
	    margin: 0.75rem 0;
	    padding-left: 1.75rem;
	}

	.message-text li {
	    margin: 0.35rem 0;
	}

	.message-text strong {
	    color: #ffffff;
	    font-weight: 750;
	}

	.message-text code {
	    padding: 0.15rem 0.4rem;
	    border: 1px solid var(--border);
	    border-radius: 5px;
	    background: #0a0e12;
	    color: #9fd3ff;
	    font-family:
	        "Cascadia Code",
	        "Fira Code",
	        Consolas,
	        monospace;
	    font-size: 0.92em;
	}

	.message-text pre {
	    margin: 1rem 0;
	    padding: 16px;
	    overflow-x: auto;
	    border: 1px solid var(--border);
	    border-radius: 9px;
	    background: #090c10;
	}

	.message-text pre code {
	    padding: 0;
	    border: none;
	    background: transparent;
	    color: #e8edf2;
	}

	.message-text blockquote {
	    margin: 1rem 0;
	    padding: 0.25rem 0 0.25rem 1rem;
	    border-left: 3px solid var(--marpa);
	    color: var(--text-muted);
	}

	.message-text a {
	    color: #7db3ff;
	}

	.message-text hr {
	    margin: 1.25rem 0;
	    border: 0;
	    border-top: 1px solid var(--border);
	}

        .profile-control {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .profile-control label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        #profile-select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface-raised);
            color: var(--text);
            outline: none;
        }

        #profile-select:focus {
            border-color: var(--user);
        }

        #profile-select:disabled {
            opacity: 0.55;
            cursor: wait;
        }
    </style>
</head>

<body>
    <main class="app-shell">
        <header class="app-header">
            <section class="brand">
                <h1>MARPA</h1>
                <p>Memory-Augmented Reasoning &amp; Planning Assistant</p>
            </section>

            <aside class="status-panel" aria-label="MARPA system status">
                <div class="status-line">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>Online</span>
                </div>

                <div class="system-detail">
                    <span>Model</span>
                    <strong>qwen2.5:3b</strong>
                </div>

                <div class="profile-control">
                    <label for="profile-select">Profile</label>

                    <select id="profile-select">
                        <option value="kevyn">Kevyn</option>
                        <option value="guest">Guest</option>
                    </select>
                </div>

                <div class="system-detail">
                    <span>Node</span>
                    <strong>marpa-node-001</strong>
                </div>

                <div class="system-detail">
                    <span>Version</span>
                    <strong>v0.3</strong>
                </div>
            </aside>
        </header>

        <section class="chat-panel" aria-label="Conversation">
            <div id="chat" aria-live="polite"></div>
        </section>

        <section class="composer">
            <textarea
                id="prompt"
                placeholder="Ask MARPA something..."
                aria-label="Message MARPA"
            ></textarea>

            <div class="composer-footer">
                <span class="composer-hint">
                    Enter to send · Shift+Enter for a new line
                </span>

                <button id="send-button" type="button">
                    Send
                </button>
            </div>
        </section>

        <footer class="app-footer">
            MARPA v0.3 · Running locally on marpa-node-001
        </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
